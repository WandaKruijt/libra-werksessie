<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Werksessie cliëntreis</title>
<script src="config.js"></script>
<style>
  :root{
    --bg:#ffffff; --bg-soft:#fdf9f6; --navy:#323c5a; --text:#2d3142; --muted:#6b7180; --line:#e7e3e8;
    --kaart:#fbf6f2; --kaart-rand:#ece3dc;
    --st-ingeregeld:#2f9e5b; --st-niet_ingeregeld:#ec7a1c; --st-wens:#f5c518; --st-leeg:#ffffff; --st-nvt:#9aa1ab;
    --badge-niet_ingeregeld:#fdebd9; --ink-niet_ingeregeld:#8a3f06;
    --badge-wens:#fdf6d3; --ink-wens:#6b5200; --badge-leeg:#ffffff; --ink-leeg:#5f6878;
    --r:12px;
    --font:"Aptos","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.5}
  main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
  .eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:4px 0 6px}
  h1{color:var(--navy);font-size:1.5rem;line-height:1.2;margin:0 0 8px}
  .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;color:var(--muted);font-size:.92rem}
  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.85rem;font-weight:600;border:1px solid transparent}
  .bol{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
  .bol.leeg{border:1.5px solid #9aa3b2}
  .bol.wens{box-shadow:0 0 0 1px #c9a000}
  .kaart{background:var(--kaart);border:1px solid var(--kaart-rand);border-radius:var(--r);padding:12px 14px;margin:10px 0}
  .kaart h2{font-size:1rem;color:var(--navy);margin:0 0 6px}
  .kaart ul{margin:0;padding-left:20px}
  .kaart li{margin:3px 0}
  .leeg-tekst{color:var(--muted);font-style:italic;margin:0}
  details.kaart summary{cursor:pointer;font-weight:600;color:var(--navy);min-height:28px}
  details.kaart p{white-space:pre-wrap;font-size:.92rem;margin:8px 0 0}
  form{margin-top:22px;border-top:2px solid var(--navy);padding-top:14px}
  .vraag{margin:0 0 22px;border:0;padding:0}
  .vraag legend,.vraag label.titel{display:block;font-weight:700;color:var(--navy);margin-bottom:8px;font-size:1.02rem}
  .vraag .nr{display:inline-flex;justify-content:center;align-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:.85rem;margin-right:6px}
  textarea,input[type=text],select{width:100%;font:inherit;border:1.5px solid #c9ccd6;border-radius:10px;padding:10px 12px;background:#fff;color:var(--text)}
  textarea{min-height:92px;resize:vertical}
  textarea:focus,input:focus,select:focus{outline:3px solid #b4c3db;border-color:var(--navy)}
  .keuzes{display:flex;flex-direction:column;gap:8px}
  .keuze{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border:1.5px solid #c9ccd6;border-radius:10px;background:#fff;cursor:pointer}
  .keuze input{width:22px;height:22px;accent-color:var(--navy);flex:none}
  .keuze:has(input:checked){border-color:var(--navy);background:#eef1f8}
  .sub{margin:8px 0 0 12px;padding-left:12px;border-left:3px solid #dce3ef}
  .sub[hidden]{display:none}
  .melding{background:#eef1f8;border-left:4px solid var(--navy);padding:10px 12px;border-radius:8px;margin:0 0 18px}
  .privacy{font-size:.9rem;color:var(--muted);margin:0 0 12px}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:52px;padding:12px 18px;cursor:pointer}
  .primair{width:100%;background:var(--navy);color:#fff}
  .secundair{background:#eef1f8;color:var(--navy)}
  button[disabled]{opacity:.6}
  .status{margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:600}
  .status.ok{background:#e3f3e8;color:#1b5e36}
  .status.fout{background:#fdebd9;color:#8a3f06}
  .status button{margin-top:10px}
  .centraal{text-align:center;padding:40px 8px;color:var(--muted)}
  footer{margin-top:28px;font-size:.8rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main id="app"><p class="centraal">Bezig met laden…</p></main>
<script>
"use strict";
const C = window.WERKSESSIE_CONFIG;
const P = new URLSearchParams(location.search);
const SESSIE = (P.get("s") || "").toLowerCase();
const TEGEL = P.get("b") || "";
const WACHTRIJ = "werksessie_wachtrij";
const app = document.getElementById("app");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LABEL = {niet_ingeregeld:"Niet ingeregeld", leeg:"Weten we niet", wens:"Wens / idee"};

async function rpc(fn, body) {
  const r = await fetch(`${C.supabaseUrl}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: {"apikey": C.supabaseKey, "Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}

// ---- wachtrij: een antwoord gaat nooit verloren als het netwerk hapert ----
function leesRij() { try { return JSON.parse(localStorage.getItem(WACHTRIJ) || "[]"); } catch { return []; } }
function schrijfRij(rij) { try { localStorage.setItem(WACHTRIJ, JSON.stringify(rij)); } catch {} }
async function verstuurRij() {
  let rij = leesRij(), over = [];
  for (const item of rij) {
    try {
      const uit = await rpc("formulier_verstuur", item);
      if (!uit.ok && uit.fout !== "gesloten" && uit.fout !== "geen_vragen") over.push(item);
    } catch { over.push(item); }
  }
  schrijfRij(over);
  return over.length;
}
window.addEventListener("online", verstuurRij);

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
}

function lijst(items, leeg) {
  return items && items.length ? `<ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`
                               : `<p class="leeg-tekst">${leeg}</p>`;
}

function keuzes(naam, opties) {
  return `<div class="keuzes">${opties.map(([waarde, tekst]) =>
    `<label class="keuze"><input type="radio" name="${naam}" value="${esc(waarde)}"> ${esc(tekst)}</label>`).join("")}</div>`;
}

function vraag(nr, titel, inhoud) {
  return `<fieldset class="vraag"><legend><span class="nr">${nr}</span>${titel}</legend>${inhoud}</fieldset>`;
}

function vraagset(b) {
  if (b.status === "leeg") return "wit";
  if (b.status === "wens") return "geel";
  return b.is_meetinstrument ? "oranje_meet" : "oranje";
}

function vragenHtml(set, d) {
  if (set === "oranje") {
    const zp = (d.zorgpaden || []).map(z =>
      `<label class="keuze"><input type="checkbox" name="zorgpad" value="${esc(z)}"> ${esc(z)}</label>`).join("");
    return vraag(1, "Hebben we iets gemist?", `<textarea name="gemist"></textarea>`)
      + vraag(2, "Moet dit in het cliëntreis protocol 1.0?", keuzes("protocol",
          [["ja_voorrang","Ja, met voorrang"],["ja","Ja"],["nee","Nee"]]))
      + vraag(3, "Voor wie?", keuzes("voor_wie",
          [["iedereen","Iedereen in deze cliëntreis"],["zorgpad","Bij een zorgpad, namelijk…"],["gebeurtenis","Bij een gebeurtenis, namelijk…"]])
          + `<div class="sub" data-bij="voor_wie=zorgpad" hidden><div class="keuzes">${zp}</div>
               <input type="text" name="zorgpad_anders" placeholder="Ander zorgpad…" style="margin-top:8px"></div>
             <div class="sub" data-bij="voor_wie=gebeurtenis" hidden>
               <input type="text" name="gebeurtenis" placeholder="Bijvoorbeeld: als een kind een spalk krijgt"></div>`)
      + vraag(4, "Waar moeten we op letten bij het inregelen?", `<textarea name="letten_op"></textarea>`);
  }
  if (set === "oranje_meet") {
    return `<p class="melding">Meetinstrumenten pakken we digitaal op <b>vanaf Q3 2027</b>.</p>`
      + vraag(1, "Welke gebruiken jullie in deze fase?", `<textarea name="welke"></textarea>`)
      + vraag(2, "Willen jullie dat wij die in 2027 digitaal oppakken?", keuzes("digitaal_2027",
          [["ja","Ja"],["nee","Nee"],["weet_niet","Weet ik niet"]]));
  }
  if (set === "wit") {
    return vraag(1, "Is hier al iets digitaals?", keuzes("al_iets",
          [["ja","Ja, namelijk…"],["nee","Nee"],["weet_niet","Weet ik niet"]])
          + `<div class="sub" data-bij="al_iets=ja" hidden><textarea name="al_iets_namelijk" placeholder="Wat is er al?"></textarea></div>`)
      + vraag(2, "Moet dit voor deze doelgroep digitaal worden?", keuzes("digitaal_worden",
          [["ja_wens","Ja: een wens"],["nee_bewust","Nee: bewust niet"],["weet_niet","Weet ik niet"]]))
      + vraag(3, "Wat zou je willen?", `<textarea name="wat_willen"></textarea>`);
  }
  return vraag(1, "Is deze wens nog actueel?", keuzes("actueel",
          [["ja","Ja"],["nee","Nee"],["weet_niet","Weet ik niet"]]))
    + vraag(2, "Wat zou je eraan toevoegen?", `<textarea name="toevoegen"></textarea>`);
}

function verzamel(form, set) {
  const f = new FormData(form), a = {};
  for (const [k, v] of f.entries()) {
    if (k === "discipline" || k === "zorgpad") continue;
    if (String(v).trim()) a[k] = String(v).trim().slice(0, 3000);
  }
  if (set === "oranje") {
    const zp = f.getAll("zorgpad");
    if (a.voor_wie === "zorgpad" && zp.length) a.zorgpaden = zp;
    if (a.voor_wie !== "zorgpad") delete a.zorgpad_anders;
    if (a.voor_wie !== "gebeurtenis") delete a.gebeurtenis;
  }
  if (set === "wit" && a.al_iets !== "ja") delete a.al_iets_namelijk;
  return a;
}

function toonFout(titel, tekst) {
  app.innerHTML = `<div class="centraal"><h1>${esc(titel)}</h1><p>${esc(tekst)}</p></div>`;
}

async function start() {
  if (!SESSIE || !TEGEL) return toonFout("QR-code niet herkend", "Scan de QR-code op het Ganzenbord opnieuw.");
  verstuurRij();
  let d;
  try { d = await rpc("formulier_tegel", {p_sessie: SESSIE, p_bouwsteen: TEGEL}); }
  catch { return toonFout("Geen verbinding", "Controleer je internet en scan opnieuw. Lukt het niet, gebruik dan het papieren tegelvel."); }
  if (d.fout === "gesloten") return toonFout("De sessie is nog niet geopend", "Of de sessie is al afgesloten. Vraag het de begeleider.");
  if (d.fout) return toonFout("QR-code niet herkend", "Scan de QR-code op het Ganzenbord opnieuw.");

  const b = d.bouwsteen, set = vraagset(b);
  document.title = `${b.naam} · ${d.reis}`;
  const disciplines = [...(d.professionals || []), "Digicoach", "Anders"];
  app.innerHTML = `
    <p class="eyebrow">Werksessie · ${esc(d.reis)}</p>
    <h1>${esc(b.naam)}</h1>
    <div class="meta"><span>${esc(b.fase_naam)}</span>
      <span class="badge" style="background:var(--badge-${b.status});color:var(--ink-${b.status});border-color:${b.status==="leeg"?"#9aa3b2":"transparent"}">
        <span class="bol ${b.status}" style="background:var(--st-${b.status})"></span>${LABEL[b.status]}</span></div>
    ${b.status_toelichting ? `<div class="kaart"><h2><span class="bol ${b.status}" style="background:var(--st-${b.status});width:11px;height:11px"></span> Waarom deze kleur</h2><p style="margin:0">${esc(b.status_toelichting)}</p></div>` : ""}
    <div class="kaart"><h2>Dit is er al (nulmeting)</h2>${lijst(b.wat_is_er_al, "Hier is nog niets over bekend. Weet jij meer? Vul het hieronder in.")}</div>
    <div class="kaart"><h2>Aandachtspunten / gaps</h2>${lijst(b.aandachtspunten, "Geen aandachtspunten bekend.")}</div>
    ${b.volledige_tekst ? `<details class="kaart"><summary>Volledige beschrijving zoals ingevuld</summary><p>${esc(b.volledige_tekst)}</p></details>` : ""}
    <form id="f" novalidate>
      ${vragenHtml(set, d)}
      <div class="vraag"><label class="titel" for="discipline">Jouw discipline <span style="font-weight:400;color:var(--muted)">(niet verplicht)</span></label>
        <select id="discipline" name="discipline"><option value="">— kies —</option>
        ${disciplines.map(x => `<option>${esc(x)}</option>`).join("")}</select></div>
      <p class="privacy">Vul geen namen of gegevens van cliënten in. Je antwoord is anoniem.</p>
      <button class="primair" type="submit">Versturen</button>
      <div id="status"></div>
    </form>
    <footer>Je kunt per tegel vaker antwoorden. Scan een andere tegel om verder te gaan.</footer>`;

  const form = document.getElementById("f");
  form.addEventListener("change", () => {
    form.querySelectorAll("[data-bij]").forEach(el => {
      const [k, v] = el.dataset.bij.split("=");
      const gekozen = form.querySelector(`input[name="${k}"]:checked`);
      el.hidden = !(gekozen && gekozen.value === v);
    });
  });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const status = document.getElementById("status");
    const antwoord = verzamel(form, set);
    if (!Object.keys(antwoord).length) {
      status.innerHTML = `<div class="status fout">Vul minstens één vraag in.</div>`; return;
    }
    const item = {p_sessie: SESSIE, p_bouwsteen: b.id, p_inzending: uuid(), p_antwoord: antwoord,
                  p_discipline: form.discipline.value || null};
    schrijfRij([...leesRij(), item]);               // eerst op de telefoon bewaren
    const knop = form.querySelector("button.primair");
    knop.disabled = true; knop.textContent = "Bezig…";
    const over = await verstuurRij();
    if (over === 0) {
      status.innerHTML = `<div class="status ok">Dank je! Je antwoord is opgeslagen.
        <br><button type="button" class="secundair" id="nog">Nog een antwoord op deze tegel</button></div>`;
      knop.hidden = true;
      document.getElementById("nog").onclick = () => location.reload();
    } else {
      knop.hidden = true;                             // niet opnieuw indienen: dat gaf een dubbel antwoord
      status.innerHTML = `<div class="status fout">Niet verstuurd: geen verbinding. Je antwoord staat veilig op je telefoon
        en gaat vanzelf mee zodra er weer internet is.<br><button type="button" class="secundair" id="opnieuw">Opnieuw proberen</button></div>`;
      document.getElementById("opnieuw").onclick = async () => {
        const rest = await verstuurRij();
        if (rest === 0) status.innerHTML = `<div class="status ok">Gelukt! Je antwoord is opgeslagen.</div>`;
      };
    }
  });
}
start();
</script>
</body>
</html>
