<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Regie werksessie</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#ffffff; --soft:#fdf9f6; --navy:#323c5a; --text:#2d3142; --muted:#6b7180; --line:#e7e3e8;
    --kaart:#fbf6f2; --kaart-rand:#ece3dc;
    --st-ingeregeld:#2f9e5b; --st-niet_ingeregeld:#ec7a1c; --st-wens:#f5c518; --st-leeg:#ffffff; --st-nvt:#9aa1ab;
    --r:12px; --font:"Aptos","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--text);background:var(--bg);font-size:16px;line-height:1.45}
  header{background:var(--navy);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  header h1{font-size:1.1rem;margin:0}
  header .rechts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  main{max-width:1400px;margin:0 auto;padding:16px 20px 60px}
  button,select,input{font:inherit}
  button{border:0;border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:650}
  .knop{background:#eef1f8;color:var(--navy)}
  .knop.licht{background:rgba(255,255,255,.15);color:#fff}
  .knop.groot{font-size:1.05rem;padding:12px 20px}
  .open-knop{background:#1b5e36;color:#fff}
  .dicht-knop{background:#8a3f06;color:#fff}
  input,select{border:1.5px solid #c9ccd6;border-radius:10px;padding:9px 12px;min-height:44px;background:#fff}
  .login{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:10px}
  .melding{padding:10px 14px;border-radius:10px;background:#eef1f8;margin:10px 0}
  .melding.fout{background:#fdebd9;color:#8a3f06}
  .balk{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:6px 0 16px}
  .pil{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-weight:700}
  .pil.open{background:#e3f3e8;color:#1b5e36}.pil.dicht{background:#eceef1;color:#3d434c}
  .tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin:10px 0 16px}
  .tabs button{background:none;border-radius:0;border-bottom:3px solid transparent;color:var(--muted)}
  .tabs button.actief{color:var(--navy);border-bottom-color:#e97132}
  .bord{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px}
  .fase{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:10px}
  .fase h2{font-size:.95rem;color:var(--navy);margin:2px 4px 10px;text-transform:uppercase;letter-spacing:.06em}
  .tegel{background:#fff;border:1.5px solid #d6dae3;border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .tegel .kop{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy)}
  .tegel .nr{color:var(--muted);font-weight:600;font-size:.85rem}
  .bol{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none}
  .bol.leeg{border:1.5px solid #9aa3b2}.bol.wens{box-shadow:0 0 0 1px #c9a000}
  .teller{margin-left:auto;background:var(--navy);color:#fff;border-radius:999px;padding:1px 10px;font-size:.85rem}
  .teller.nul{background:#eceef1;color:var(--muted)}
  .voorstel{margin-top:8px;font-size:.9rem;padding:6px 8px;border-radius:8px;background:#eef1f8;display:flex;gap:6px;align-items:flex-start;text-align:left}
  .voorstel .bol{margin-top:2px}
  .voorstel .pijl{color:var(--muted)}
  .detail{margin-top:8px;font-size:.88rem}
  .detail h4{margin:8px 0 2px;font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .detail ul{margin:0;padding-left:18px}
  .balkje{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0}
  .balkje span{background:#eef1f8;border-radius:6px;padding:1px 7px}
  .legenda{display:flex;flex-wrap:wrap;gap:14px;font-size:.88rem;color:var(--muted);margin:0 0 12px}
  .legenda span{display:inline-flex;gap:6px;align-items:center}
  table{border-collapse:collapse;width:100%}
  td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
  .klein{font-size:.85rem;color:var(--muted)}
  /* duidelijke status open/dicht */
  .status{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;padding:14px 18px;border-radius:14px;margin:4px 0 14px;border:2px solid}
  .status.open{background:#e3f3e8;border-color:#2f9e5b;color:#1b5e36}
  .status.dicht{background:#f1f2f4;border-color:#9aa1ab;color:#3d434c}
  .status .lamp{width:22px;height:22px;border-radius:50%;flex:none}
  .status.open .lamp{background:#2f9e5b;box-shadow:0 0 0 5px rgba(47,158,91,.22);animation:puls 1.6s ease-in-out infinite}
  .status.dicht .lamp{background:#9aa1ab}
  .status .woord{font-size:1.45rem;font-weight:800;letter-spacing:.02em}
  .status .uitleg{font-size:.95rem}
  .status button{margin-left:auto}
  @keyframes puls{50%{box-shadow:0 0 0 9px rgba(47,158,91,.08)}}
  header.open{box-shadow:inset 0 -6px 0 #2f9e5b}
  header.dicht{box-shadow:inset 0 -6px 0 #9aa1ab}
  .pil.open::before{content:"";width:9px;height:9px;border-radius:50%;background:#2f9e5b}
  .pil.dicht::before{content:"";width:9px;height:9px;border-radius:50%;background:#9aa1ab}
  /* bijdragen per indiener */
  .uitklap{margin-top:8px;width:100%;min-height:38px;padding:6px 10px;background:#eef1f8;color:var(--navy);font-size:.9rem;text-align:left}
  .uitklap[disabled]{opacity:.5;cursor:default}
  .tegel.uit{border-color:var(--navy);box-shadow:0 2px 10px rgba(50,60,90,.12)}
  .bijdragen{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .bijdrage{border-radius:10px;padding:10px 12px;background:var(--bkl-bg);border:1.5px solid var(--bkl);border-left-width:7px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .bijdrage .bkop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .bijdrage .bnr{background:var(--bkl);color:#fff;border-radius:999px;padding:1px 10px;font-weight:800;font-size:.85rem}
  .bijdrage .bwie{font-weight:700;color:var(--navy)}
  .bijdrage .btijd{margin-left:auto;font-size:.8rem;color:var(--muted)}
  .bijdrage dl{margin:0;display:grid;grid-template-columns:1fr;gap:4px}
  .bijdrage dt{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:2px}
  .bijdrage dd{margin:0;font-size:.95rem;white-space:pre-wrap}
  .bijdrage dd.keus{font-weight:700}
  .uitklapbalk{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  /* wensenlijst: bord met plakbriefjes */
  #wensen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#f4f2ee}
  #wensen[hidden]{display:none}
  .wkop{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 20px;background:var(--navy);color:#fff}
  .wkop h2{margin:0;font-size:1.25rem}
  .wkop .aantal{background:rgba(255,255,255,.18);border-radius:999px;padding:2px 12px;font-weight:700}
  .wkop .filters{display:flex;gap:6px;flex-wrap:wrap}
  .wkop .filters button{background:rgba(255,255,255,.12);color:#fff;min-height:38px;padding:6px 12px}
  .wkop .filters button.actief{background:#fff;color:var(--navy)}
  .wkop .sluit{margin-left:auto}
  .canvas{flex:1;overflow:auto;padding:26px 26px 60px;background-color:#f4f2ee;
    background-image:radial-gradient(#d3cec6 1.2px,transparent 1.2px);background-size:22px 22px}
  .clusters{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-start}
  .cluster{background:rgba(255,255,255,.55);border:1.5px dashed #c9c2b8;border-radius:16px;padding:12px 14px 16px;max-width:100%}
  .cluster h3{display:flex;align-items:center;gap:8px;margin:0 2px 12px;font-size:1rem;color:var(--navy)}
  .cluster h3 .klein{font-weight:500}
  .briefjes{display:flex;flex-wrap:wrap;gap:16px}
  .briefje{all:unset;box-sizing:border-box;cursor:pointer;width:220px;min-height:170px;padding:14px 14px 12px;border-radius:3px;
    display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 1px rgba(0,0,0,.08),0 8px 16px -6px rgba(0,0,0,.22);
    transform:rotate(var(--rot));transition:transform .15s,box-shadow .15s;font-family:var(--font);color:#2d3142}
  .briefje:hover,.briefje:focus-visible{transform:rotate(0) scale(1.04);box-shadow:0 2px 3px rgba(0,0,0,.1),0 14px 26px -8px rgba(0,0,0,.3);outline:none}
  .briefje.wit{background:#fffdf8;border-top:10px solid #dfe3ea}
  .briefje.geel{background:#fff3a6;border-top:10px solid #f5c518}
  .briefje .woord{font-size:1.35rem;font-weight:800;line-height:1.15;color:var(--navy);word-break:break-word}
  .briefje .tekst{font-size:.92rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .briefje .wie{margin-top:auto;font-size:.78rem;color:#6b7180}
  mark{background:linear-gradient(transparent 35%,#ffb27a 35%,#ffb27a 92%,transparent 92%);color:inherit;padding:0 2px;border-radius:2px}
  .briefje.geel mark{background:linear-gradient(transparent 35%,#ff9f5a 35%,#ff9f5a 92%,transparent 92%)}
  .woord mark{background:linear-gradient(transparent 55%,#ffb27a 55%,#ffb27a 95%,transparent 95%)}
  .leegbord{max-width:520px;margin:60px auto;text-align:center;color:var(--muted);font-size:1.1rem}
  .wdetail{position:fixed;inset:0;z-index:60;background:rgba(30,34,48,.55);display:flex;align-items:center;justify-content:center;padding:20px}
  .wdetail .paneel{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .wdetail .paneel.geel{border-top:12px solid #f5c518}.wdetail .paneel.wit{border-top:12px solid #dfe3ea}
  .wdetail .groot{font-size:2rem;font-weight:800;color:var(--navy);margin:2px 0 6px}
  .wdetail .wens{font-size:1.15rem;line-height:1.5;white-space:pre-wrap;margin:6px 0 14px}
  .wdetail .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.9rem;margin-bottom:10px}
  .wdetail dl{margin:0 0 12px}.wdetail dt{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:8px}
  .wdetail dd{margin:0;white-space:pre-wrap}
  .woordkeus{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .woordkeus button{min-height:34px;padding:4px 10px;background:#eef1f8;color:var(--navy);font-weight:600}
  .woordkeus button.actief{background:#ffb27a;color:#2d3142}
  body.presenteren{font-size:19px}
  body.presenteren main{max-width:none}
  body.presenteren .verberg-presenteren{display:none}
  @media (max-width:900px){.bord{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1 id="kop">Regie werksessie</h1>
  <div class="rechts verberg-presenteren" id="kopknoppen"></div>
</header>
<main id="app"></main>
<script>
"use strict";
const C = window.WERKSESSIE_CONFIG;
const sb = supabase.createClient(C.supabaseUrl, C.supabaseKey);
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KLEUR = {ingeregeld:"groen", niet_ingeregeld:"oranje", wens:"geel", leeg:"wit", nvt:"grijs"};
const LABEL = {ingeregeld:"Ingeregeld", niet_ingeregeld:"Niet ingeregeld", wens:"Wens / idee", leeg:"Weten we niet", nvt:"N.v.t."};
const bol = st => `<span class="bol ${st}" style="background:var(--st-${st})" title="${LABEL[st]}"></span>`;
const TEKST = {
  protocol:{ja_voorrang:"ja, met voorrang", ja:"ja", nee:"nee"},
  voor_wie:{iedereen:"iedereen", zorgpad:"bij een zorgpad", gebeurtenis:"bij een gebeurtenis"},
  digitaal_2027:{ja:"ja", nee:"nee", weet_niet:"weet niet"},
  al_iets:{ja:"ja", nee:"nee", weet_niet:"weet niet"},
  digitaal_worden:{ja_wens:"ja: een wens", nee_bewust:"nee: bewust niet", weet_niet:"weet niet"},
  actueel:{ja:"ja", nee:"nee", weet_niet:"weet niet"}
};
const BKL = [["#3b6fb6","#eef3fb"],["#c2571a","#fdf1e8"],["#2f8a57","#ebf6ef"],["#8a4fb0","#f4eefa"],["#b8860b","#fbf5e3"],["#1f8a8a","#e8f6f6"],["#b03a5b","#fbecf0"],["#5a6478","#f0f2f5"]];
const VELDEN = {
  oranje:[["protocol","Protocol 1.0",TEKST.protocol],["voor_wie","Voor wie",TEKST.voor_wie],["zorgpaden","Zorgpaden"],["zorgpad_anders","Ander zorgpad"],["gebeurtenis","Bij welke gebeurtenis"],["gemist","Hebben we iets gemist?"],["letten_op","Letten op bij inregelen"]],
  oranje_meet:[["digitaal_2027","Digitaal oppakken in 2027",TEKST.digitaal_2027],["welke","Welke meetinstrumenten"]],
  wit:[["al_iets","Is er al iets digitaals?",TEKST.al_iets],["al_iets_namelijk","Wat is er al"],["digitaal_worden","Moet het digitaal worden?",TEKST.digitaal_worden],["wat_willen","Wat zou je willen"]],
  geel:[["actueel","Wens nog actueel?",TEKST.actueel],["toevoegen","Toevoegingen"]]
};
const ALLE_VELDEN = [...new Map(Object.values(VELDEN).flat().map(v => [v[0], v])).values()];
function waardeTekst(a, v) {
  const w = a.antwoord?.[v[0]];
  if (w == null || w === "" || (Array.isArray(w) && !w.length)) return "";
  if (Array.isArray(w)) return w.join(", ");
  return v[2] ? (v[2][w] || w) : String(w);
}
function bijdrageKaart(a, i) {
  const [kl, bg] = BKL[i % BKL.length];
  const velden = VELDEN[a.vraagset] || ALLE_VELDEN;
  const regels = velden.map(v => [v, waardeTekst(a, v)]).filter(([, t]) => t)
    .map(([v, t]) => `<dt>${esc(v[1])}</dt><dd class="${v[2] ? "keus" : ""}">${esc(t)}</dd>`).join("");
  const tijd = new Date(a.ontvangen_op).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
  return `<div class="bijdrage" style="--bkl:${kl};--bkl-bg:${bg}">
    <div class="bkop"><span class="bnr">${i+1}</span><span class="bwie">${esc(a.discipline || "Geen discipline")}</span><span class="btijd">${tijd}</span></div>
    <dl>${regels || `<dd class="klein">Geen tekst ingevuld.</dd>`}</dl></div>`;
}
function wisselUit(id) { staat.open.has(id) ? staat.open.delete(id) : staat.open.add(id); render(); }
function allesUit(aan) {
  staat.open = new Set(aan ? staat.bouwstenen.filter(b => staat.antwoorden.some(a => a.bouwsteen_id === b.bouwsteen_id)).map(b => b.bouwsteen_id) : []);
  render();
}

// ---------- wensenlijst ----------
const STOP = new Set(("aan al alle alles als altijd ander andere anders bij dan dat de deze die dit doen door dus een eens en er"
 + " ge geen graag had heb hebben heeft hem het hier hij hoe hun ik in is ja je jij jou kan kunnen kun komen laat maar"
 + " me meer men met mij mijn moet moeten na naar niet niets nog nu of om omdat ons onze ook op over per te tegen toch"
 + " tot u uit uw van veel voor waar wat we wel welk welke wij wil willen wordt worden word zal ze zelf zich zij zijn zo"
 + " zoals zou zouden test bijvoorbeeld bv etc echt even heel goed gewoon via iets iemand waarbij waardoor wanneer").split(" "));
const WENSVELD = {wit:["wat_willen","Wat zou je willen?"], geel:["toevoegen","Wat zou je eraan toevoegen?"]};
const woordenVan = t => (String(t).match(/[\p{L}][\p{L}\p{N}'-]*/gu) || []);
function lees(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function schrijf(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function wensen() {
  const lijst = staat.antwoorden.filter(a => WENSVELD[a.vraagset] && String(a.antwoord?.[WENSVELD[a.vraagset][0]] || "").trim())
    .map(a => ({a, tekst: String(a.antwoord[WENSVELD[a.vraagset][0]]).trim()}));
  const df = {};
  lijst.forEach(w => new Set(woordenVan(w.tekst).map(x => x.toLowerCase())).forEach(x => df[x] = (df[x]||0) + 1));
  lijst.forEach(w => {
    const eigen = lees("wenswoord:" + w.a.id);
    if (eigen && woordenVan(w.tekst).some(x => x.toLowerCase() === eigen.toLowerCase())) { w.woord = eigen; return; }
    let best = null, score = -1;
    woordenVan(w.tekst).forEach((x, i) => {
      const l = x.toLowerCase(); if (STOP.has(l) || l.length < 3 || /^\d+$/.test(l)) return;
      const sc = Math.log(1 + lijst.length / df[l]) + Math.min(l.length, 12) / 5 - i * 0.02;
      if (sc > score) { score = sc; best = x; }
    });
    w.woord = best || woordenVan(w.tekst)[0] || w.tekst.slice(0, 20);
  });
  return lijst;
}
function markeer(tekst, woord) {
  const t = esc(tekst); if (!woord) return t;
  const re = new RegExp(`(^|[^\\p{L}])(${esc(woord).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})(?![\\p{L}])`, "iu");
  return t.replace(re, "$1<mark>$2</mark>");
}
function toonWensen(aan) {
  staat.wensen = aan; staat.wensDetail = null; staat.wensSig = null;
  if (aan) document.documentElement.requestFullscreen?.().catch(()=>{});
  else if (!document.body.classList.contains("presenteren")) document.exitFullscreen?.().catch(()=>{});
  renderWensen(true);
}
function renderWensen(forceer) {
  let el = document.getElementById("wensen");
  if (!el) { el = document.createElement("div"); el.id = "wensen"; document.body.appendChild(el); }
  if (!staat.wensen) { el.hidden = true; el.innerHTML = ""; return; }
  const lijst = wensen(), f = staat.wensFilter || "alle";
  const sig = JSON.stringify([f, staat.wensDetail, lijst.map(w => [w.a.id, w.woord])]);
  if (!forceer && sig === staat.wensSig) return;
  staat.wensSig = sig;
  const scroll = el.querySelector(".canvas")?.scrollTop || 0;
  const zicht = lijst.filter(w => f === "alle" || w.a.vraagset === f);
  const perB = staat.bouwstenen.map(b => [b, zicht.filter(w => w.a.bouwsteen_id === b.bouwsteen_id)]).filter(([, ws]) => ws.length);
  const n = k => lijst.filter(w => k === "alle" || w.a.vraagset === k).length;
  el.hidden = false;
  el.innerHTML = `
    <div class="wkop"><h2>Wensenlijst</h2><span class="aantal">${zicht.length} ${zicht.length===1?"wens":"wensen"}</span>
      <div class="filters">${[["alle","Alle"],["wit","Uit witte bouwstenen"],["geel","Uit gele bouwstenen"]].map(([k,t]) =>
        `<button class="${f===k?"actief":""}" onclick="staat.wensFilter='${k}';renderWensen(true)">${t} (${n(k)})</button>`).join("")}</div>
      <button class="knop licht sluit" onclick="toonWensen(false)">Sluiten</button></div>
    <div class="canvas">${perB.length ? `<div class="clusters">${perB.map(([b, ws]) => `
      <section class="cluster"><h3>${bol(b.status)}${esc(b.naam)} <span class="klein">· ${esc(b.fase_naam)}</span></h3>
        <div class="briefjes">${ws.map(w => {
          const rot = ((w.a.id * 37) % 7 - 3) * 0.55;
          return `<button class="briefje ${w.a.vraagset}" style="--rot:${rot}deg" onclick="staat.wensDetail=${w.a.id};renderWensen(true)">
            <span class="woord"><mark>${esc(w.woord)}</mark></span>
            ${w.tekst.toLowerCase() === w.woord.toLowerCase() ? "" : `<span class="tekst">${markeer(w.tekst, w.woord)}</span>`}
            <span class="wie">${esc(w.a.discipline || "Geen discipline")}</span></button>`; }).join("")}</div>
      </section>`).join("")}</div>`
      : `<div class="leegbord">Nog geen wensen.<br>Hier komen de antwoorden op <b>"Wat zou je willen?"</b> (witte bouwstenen)
         en <b>"Wat zou je eraan toevoegen?"</b> (gele bouwstenen).</div>`}</div>
    ${staat.wensDetail ? wensDetail(lijst.find(w => w.a.id === staat.wensDetail)) : ""}`;
  const c = el.querySelector(".canvas"); if (c) c.scrollTop = scroll;
}
function wensDetail(w) {
  if (!w) return "";
  const a = w.a, b = staat.bouwstenen.find(x => x.bouwsteen_id === a.bouwsteen_id) || {};
  const tijd = new Date(a.ontvangen_op).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
  const overig = (VELDEN[a.vraagset] || []).filter(v => v[0] !== WENSVELD[a.vraagset][0])
    .map(v => [v, waardeTekst(a, v)]).filter(([, t]) => t).map(([v, t]) => `<dt>${esc(v[1])}</dt><dd>${esc(t)}</dd>`).join("");
  const keuzes = [...new Map(woordenVan(w.tekst).filter(x => x.length > 2).map(x => [x.toLowerCase(), x])).values()];
  return `<div class="wdetail" onclick="if(event.target===this){staat.wensDetail=null;renderWensen(true)}">
    <div class="paneel ${a.vraagset}" role="dialog" aria-modal="true">
      <div class="meta"><span>${bol(b.status || "leeg")} ${esc(b.naam || a.bouwsteen_id)}</span><span>${esc(b.fase_naam || "")}</span>
        <span>${esc(a.discipline || "Geen discipline")}</span><span>${tijd}</span></div>
      <div class="groot"><mark>${esc(w.woord)}</mark></div>
      <dt class="klein" style="text-transform:uppercase;letter-spacing:.04em">${esc(WENSVELD[a.vraagset][1])}</dt>
      <div class="wens">${markeer(w.tekst, w.woord)}</div>
      ${overig ? `<dl>${overig}</dl>` : ""}
      <details><summary class="klein" style="cursor:pointer">Ander woord uitlichten</summary>
        <div class="woordkeus">${keuzes.map(x => `<button class="${x.toLowerCase()===w.woord.toLowerCase()?"actief":""}"
          onclick='schrijf("wenswoord:${a.id}", ${JSON.stringify(x).replace(/'/g,"&#39;")});renderWensen(true)'>${esc(x)}</button>`).join("")}
          <button onclick='schrijf("wenswoord:${a.id}", null);renderWensen(true)'>Automatisch</button></div></details>
      <div style="display:flex;justify-content:flex-end;margin-top:16px">
        <button class="knop" onclick="staat.wensDetail=null;renderWensen(true)">Terug naar het bord</button></div>
    </div></div>`;
}
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || !staat.wensen) return;
  if (staat.wensDetail) { staat.wensDetail = null; renderWensen(true); } else toonWensen(false);
});

let staat = {sessie:null, bouwstenen:[], antwoorden:[], tab:"live", timer:null, open:new Set()};

// ---------- inloggen ----------
async function start() {
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return toonLogin();
  const {data:isB, error} = await sb.rpc("is_beheerder");
  if (error || !isB) {
    app.innerHTML = `<div class="login"><p class="melding fout">Dit account heeft geen toegang tot de regie.</p>
      <button class="knop" onclick="uitloggen()">Uitloggen</button></div>`;
    return;
  }
  kopKnoppen();
  const s = new URLSearchParams(location.hash.slice(1)).get("sessie");
  s ? openSessie(s) : toonSessies();
}
function toonLogin(fout) {
  document.getElementById("kopknoppen").innerHTML = "";
  app.innerHTML = `<form class="login" id="lf"><h2 style="color:var(--navy);margin:0">Inloggen</h2>
    ${fout ? `<p class="melding fout">${esc(fout)}</p>` : ""}
    <input type="email" name="email" placeholder="E-mailadres" autocomplete="username" required>
    <input type="password" name="pw" placeholder="Wachtwoord" autocomplete="current-password" required>
    <button class="knop groot" style="background:var(--navy);color:#fff">Inloggen</button></form>`;
  document.getElementById("lf").onsubmit = async e => {
    e.preventDefault();
    const {error} = await sb.auth.signInWithPassword({email:e.target.email.value, password:e.target.pw.value});
    error ? toonLogin("Inloggen mislukt. Controleer e-mailadres en wachtwoord.") : start();
  };
}
async function uitloggen() { await sb.auth.signOut(); location.hash = ""; toonLogin(); }
function kopKnoppen() {
  document.getElementById("kopknoppen").innerHTML = `
    <button class="knop licht" onclick="location.hash='';toonSessies()">Alle sessies</button>
    <button class="knop licht" onclick="uitloggen()">Uitloggen</button>`;
}

// ---------- sessies ----------
async function toonSessies() {
  stopTimer(); if (staat.wensen) toonWensen(false);
  document.querySelector("header").className = "";
  document.getElementById("kop").textContent = "Regie werksessie";
  const [{data:sessies}, {data:reizen}] = await Promise.all([
    sb.from("sessies").select("code,titel,datum,open,reis_id").order("datum", {ascending:false}),
    sb.from("reizen").select("id,clientreis,expertgroep").order("expertgroep")
  ]);
  app.innerHTML = `
    <h2 style="color:var(--navy)">Sessies</h2>
    <table><tr><th>Datum</th><th>Sessie</th><th>Cliëntreis</th><th>Status</th><th></th></tr>
    ${(sessies||[]).map(s => `<tr><td>${esc(s.datum||"")}</td><td>${esc(s.titel)}<div class="klein">code ${esc(s.code)}</div></td>
      <td>${esc((reizen||[]).find(r=>r.id===s.reis_id)?.clientreis || s.reis_id)}</td>
      <td><span class="pil ${s.open?"open":"dicht"}">${s.open?"open":"dicht"}</span></td>
      <td><button class="knop" onclick="location.hash='sessie=${s.code}';openSessie('${s.code}')">Openen</button></td></tr>`).join("")}
    </table>
    <details style="margin-top:26px"><summary style="cursor:pointer;font-weight:700;color:var(--navy)">Nieuwe sessie aanmaken</summary>
      <form id="nf" class="balk" style="margin-top:12px">
        <select name="reis" required>${(reizen||[]).map(r=>`<option value="${esc(r.id)}">${esc(r.expertgroep)} — ${esc(r.clientreis)}</option>`).join("")}</select>
        <input name="titel" placeholder="Titel, bijv. Werksessie expertgroep CP" required style="min-width:280px">
        <input name="datum" type="date" required>
        <button class="knop">Aanmaken</button></form>
      <p class="klein">Na het aanmaken vraag je Claude om het Ganzenbord en de tegelvellen voor deze sessie te genereren (met de sessiecode).</p>
    </details>`;
  document.getElementById("nf").onsubmit = async e => {
    e.preventDefault();
    const a = "abcdefghijklmnopqrstuvwxyz0123456789", r = crypto.getRandomValues(new Uint8Array(10));
    const code = [...r].map(x => a[x % 36]).join("");
    const {error} = await sb.from("sessies").insert({code, reis_id:e.target.reis.value, titel:e.target.titel.value, datum:e.target.datum.value, open:false});
    if (error) alert("Aanmaken mislukt: " + error.message); else toonSessies();
  };
}

async function openSessie(code) {
  const {data:s} = await sb.from("sessies").select("*").eq("code", code).single();
  if (!s) return toonSessies();
  const {data:bs} = await sb.from("bouwstenen").select("*").eq("reis_id", s.reis_id).order("nr");
  const {data:r} = await sb.from("reizen").select("*").eq("id", s.reis_id).single();
  staat.sessie = s; staat.reis = r; staat.bouwstenen = bs || [];
  document.getElementById("kop").textContent = `${s.titel}`;
  await laadAntwoorden();
  render();
  stopTimer(); staat.timer = setInterval(async () => { await laadAntwoorden(); render(); renderWensen(); }, 10000);
}
function stopTimer() { if (staat.timer) clearInterval(staat.timer); staat.timer = null; }
async function laadAntwoorden() {
  const {data} = await sb.from("antwoorden").select("*").eq("sessie_code", staat.sessie.code).order("ontvangen_op");
  staat.antwoorden = data || [];
}
async function zetOpen(open) {
  const {error} = await sb.from("sessies").update({open}).eq("code", staat.sessie.code);
  if (error) return alert("Lukt niet: " + error.message);
  staat.sessie.open = open; render();
}

// ---------- kleurvoorstel (alleen een voorstel; de groep en Wanda beslissen) ----------
function tel(lijst, veld) {
  const t = {}; lijst.forEach(a => { const v = a.antwoord[veld]; if (v) t[v] = (t[v]||0) + 1; }); return t;
}
function meest(t) {
  const e = Object.entries(t).sort((a,b) => b[1]-a[1]);
  if (!e.length || (e[1] && e[1][1] === e[0][1])) return null;   // gelijkspel = geen voorstel
  return e[0][0];
}
function voorstel(b, ant) {
  if (!ant.length) return null;
  const set = ant[0].vraagset;
  if (set === "oranje") {
    const t = tel(ant, "protocol"), ja = (t.ja||0) + (t.ja_voorrang||0), nee = t.nee||0;
    if (ja > nee) return {kleur:"niet_ingeregeld", tekst:`Akkoord voor protocol 1.0${t.ja_voorrang?` (${t.ja_voorrang}× met voorrang)`:""} — blijft oranje tot het is ingeregeld`};
    if (nee > ja) return {kleur:"nvt", tekst:"Niet in het protocol — grijs?"};
    return {kleur:b.status, tekst:"Nog geen duidelijk akkoord"};
  }
  if (set === "oranje_meet") {
    const m = meest(tel(ant, "digitaal_2027"));
    if (m === "ja") return {kleur:"niet_ingeregeld", tekst:"Op de lijst voor Q3 2027"};
    if (m === "nee") return {kleur:"nvt", tekst:"Niet digitaal oppakken — grijs?"};
    return {kleur:b.status, tekst:"Nog geen duidelijk antwoord"};
  }
  if (set === "wit") {
    if ((tel(ant, "al_iets").ja||0) > 0 && meest(tel(ant, "al_iets")) === "ja") return {kleur:"niet_ingeregeld", tekst:"Er is al iets — oranje?"};
    const m = meest(tel(ant, "digitaal_worden"));
    if (m === "ja_wens") return {kleur:"wens", tekst:"Wens — geel?"};
    if (m === "nee_bewust") return {kleur:"nvt", tekst:"Bewust niet digitaal — grijs?"};
    return {kleur:"leeg", tekst:"Blijft wit"};
  }
  const m = meest(tel(ant, "actueel"));
  if (m === "nee") return {kleur:"leeg", tekst:"Wens niet meer actueel — wit?"};
  return {kleur:"wens", tekst:"Wens blijft staan"};
}

function telTekst(t, map) {
  return Object.entries(t).map(([k,v]) => `<span>${esc(map[k]||k)}: <b>${v}</b></span>`).join("");
}
function lijstTekst(ant, veld, extra) {
  const items = ant.filter(a => a.antwoord[veld]).map(a =>
    `<li>${esc(a.antwoord[veld])}${a.discipline ? ` <span class="klein">(${esc(a.discipline)})</span>` : ""}${extra ? extra(a) : ""}</li>`);
  return items.length ? `<ul>${items.join("")}</ul>` : "";
}
function detail(b, ant) {
  if (!ant.length) return `<div class="detail klein">Nog geen antwoorden.</div>`;
  const set = ant[0].vraagset, d = [];
  const blok = (titel, inhoud) => inhoud ? d.push(`<h4>${titel}</h4>${inhoud}`) : null;
  if (set === "oranje") {
    blok("Protocol 1.0", `<div class="balkje">${telTekst(tel(ant,"protocol"), TEKST.protocol)}</div>`);
    const zp = {}; ant.forEach(a => (a.antwoord.zorgpaden||[]).forEach(z => zp[z]=(zp[z]||0)+1));
    blok("Voor wie", `<div class="balkje">${telTekst(tel(ant,"voor_wie"), TEKST.voor_wie)}${telTekst(zp,{})}</div>`
      + lijstTekst(ant,"zorgpad_anders") + lijstTekst(ant,"gebeurtenis"));
    blok("Gemist", lijstTekst(ant,"gemist"));
    blok("Letten op bij inregelen", lijstTekst(ant,"letten_op"));
  } else if (set === "oranje_meet") {
    blok("Digitaal oppakken in 2027", `<div class="balkje">${telTekst(tel(ant,"digitaal_2027"), TEKST.digitaal_2027)}</div>`);
    blok("Welke meetinstrumenten", lijstTekst(ant,"welke"));
  } else if (set === "wit") {
    blok("Is er al iets digitaals", `<div class="balkje">${telTekst(tel(ant,"al_iets"), TEKST.al_iets)}</div>` + lijstTekst(ant,"al_iets_namelijk"));
    blok("Moet het digitaal worden", `<div class="balkje">${telTekst(tel(ant,"digitaal_worden"), TEKST.digitaal_worden)}</div>`);
    blok("Wat zou je willen", lijstTekst(ant,"wat_willen"));
  } else {
    blok("Wens nog actueel", `<div class="balkje">${telTekst(tel(ant,"actueel"), TEKST.actueel)}</div>`);
    blok("Toevoegingen", lijstTekst(ant,"toevoegen"));
  }
  return `<div class="detail">${d.join("")}</div>`;
}

// ---------- weergave ----------
function render() {
  const s = staat.sessie, n = staat.antwoorden.length;
  const laatst = n ? new Date(staat.antwoorden[n-1].ontvangen_op).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}) : "–";
  const fases = [...new Map(staat.bouwstenen.map(b => [b.fase, b.fase_naam])).entries()];
  const perTegel = id => staat.antwoorden.filter(a => a.bouwsteen_id === id);
  const toonDetail = staat.tab === "terugblik";
  document.querySelector("header").className = s.open ? "open" : "dicht";

  app.innerHTML = `
    <div class="status ${s.open?"open":"dicht"} verberg-presenteren" role="status">
      <span class="lamp"></span>
      <div><div class="woord">${s.open ? "SESSIE IS OPEN" : "SESSIE IS DICHT"}</div>
        <div class="uitleg">${s.open ? "De QR-codes werken: deelnemers kunnen nu antwoorden insturen."
                                     : "De QR-codes werken niet: deelnemers kunnen nu niets insturen."}</div></div>
      ${s.open ? `<button class="dicht-knop groot" onclick="zetOpen(false)">Sessie sluiten</button>`
               : `<button class="open-knop groot" onclick="zetOpen(true)">Sessie openen</button>`}
    </div>
    <div class="balk verberg-presenteren">
      <span><b>${n}</b> antwoorden · laatste om ${laatst}</span>
      <span class="klein">ververst elke 10 seconden</span>
      <span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
        <button class="knop" onclick="exporteer('json')">Download antwoorden (JSON)</button>
        <button class="knop" onclick="exporteer('xlsx')">Download (Excel)</button>
        <button class="knop" onclick="presenteer()">Presenteren</button>
        <button class="knop" onclick="toonWensen(true)">Wensenlijst</button></span>
    </div>
    <div class="tabs verberg-presenteren">
      <button class="${staat.tab==="live"?"actief":""}" onclick="staat.tab='live';render()">Live</button>
      <button class="${staat.tab==="terugblik"?"actief":""}" onclick="staat.tab='terugblik';render()">Terugblik</button>
    </div>
    <div class="legenda">${Object.keys(LABEL).map(k => `<span>${bol(k)} ${KLEUR[k]} · ${LABEL[k]}</span>`).join("")}
      ${toonDetail ? `<span>→ = voorstel uit de antwoorden, de groep beslist</span>` : ""}</div>
    ${toonDetail ? `<div class="uitklapbalk"><button class="knop" onclick="allesUit(true)">Alle bijdragen uitklappen</button>
      <button class="knop" onclick="allesUit(false)">Alles inklappen</button></div>` : ""}
    <div class="bord">${fases.map(([fid, fnaam]) => `
      <section class="fase"><h2>${esc(fnaam)}</h2>
      ${staat.bouwstenen.filter(b => b.fase === fid).map(b => {
        const ant = perTegel(b.bouwsteen_id), v = toonDetail ? voorstel(b, ant) : null;
        const uit = toonDetail && ant.length && staat.open.has(b.bouwsteen_id);
        return `<div class="tegel ${uit?"uit":""}"><div class="kop">${bol(b.status)}<span>${esc(b.naam)}</span>
          <span class="teller ${ant.length?"":"nul"}">${ant.length}</span></div>
          ${v ? `<div class="voorstel">${bol(b.status)}<span class="pijl">→</span>${bol(v.kleur)}<span>${esc(v.tekst)}</span></div>` : ""}
          ${toonDetail ? detail(b, ant) : ""}
          ${toonDetail && ant.length ? `<button class="uitklap" aria-expanded="${uit}" onclick="wisselUit('${esc(b.bouwsteen_id)}')">${uit ? "▴ Bijdragen inklappen" : `▾ Toon ${ant.length} ${ant.length===1?"bijdrage":"bijdragen"} per indiener`}</button>` : ""}
          ${uit ? `<div class="bijdragen">${ant.map(bijdrageKaart).join("")}</div>` : ""}</div>`; }).join("")}
      </section>`).join("")}</div>`;
}

function presenteer() {
  document.body.classList.toggle("presenteren");
  staat.tab = "terugblik"; render();
  if (document.body.classList.contains("presenteren")) {
    document.documentElement.requestFullscreen?.().catch(()=>{});
    if (!document.getElementById("stoppres")) {
      const k = document.createElement("button"); k.id = "stoppres"; k.className = "knop";
      k.textContent = "Stop presenteren"; k.style.cssText = "position:fixed;right:14px;bottom:14px;opacity:.6";
      k.onclick = () => { document.body.classList.remove("presenteren"); k.remove(); document.exitFullscreen?.().catch(()=>{}); };
      document.body.appendChild(k);
    }
  }
}

function laadXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, nok) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    sc.onload = ok; sc.onerror = () => nok(new Error("Excel-bibliotheek kon niet laden"));
    document.head.appendChild(sc);
  });
}
async function exporteerExcel(stempel) {
  try { await laadXlsx(); } catch (e) { return alert(e.message + ". Probeer het opnieuw of gebruik de JSON-download."); }
  const s = staat.sessie, bs = staat.bouwstenen, fase = Object.fromEntries(bs.map(b => [b.bouwsteen_id, b]));
  const SET = {oranje:"oranje", oranje_meet:"oranje (meetinstrument)", wit:"wit", geel:"geel"};
  const teller = {};
  const rijen = staat.antwoorden.map(a => {
    const b = fase[a.bouwsteen_id] || {}; teller[a.bouwsteen_id] = (teller[a.bouwsteen_id]||0) + 1;
    const r = {"Ontvangen op": new Date(a.ontvangen_op).toLocaleString("nl-NL"), "Fase": b.fase_naam || "",
      "Nr": b.nr ?? "", "Bouwsteen": b.naam || a.bouwsteen_id, "Bijdrage": teller[a.bouwsteen_id],
      "Kleur bij antwoord": KLEUR[a.status_bij_antwoord] || a.status_bij_antwoord,
      "Vraagset": SET[a.vraagset] || a.vraagset, "Discipline": a.discipline || ""};
    ALLE_VELDEN.forEach(v => r[v[1]] = waardeTekst(a, v));
    return r;
  });
  const kop = ["Ontvangen op","Fase","Nr","Bouwsteen","Bijdrage","Kleur bij antwoord","Vraagset","Discipline", ...ALLE_VELDEN.map(v => v[1])];
  const ws1 = XLSX.utils.json_to_sheet(rijen, {header:kop});
  ws1["!cols"] = kop.map(k => ({wch: ["Hebben we iets gemist?","Letten op bij inregelen","Welke meetinstrumenten","Wat is er al","Wat zou je willen","Toevoegingen"].includes(k) ? 50 : k === "Bouwsteen" ? 34 : 18}));
  ws1["!autofilter"] = {ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:Math.max(rijen.length,1), c:kop.length-1}})};
  const per = bs.map(b => {
    const ant = staat.antwoorden.filter(a => a.bouwsteen_id === b.bouwsteen_id), v = voorstel(b, ant);
    return {"Fase": b.fase_naam, "Nr": b.nr, "Bouwsteen": b.naam, "Huidige kleur": KLEUR[b.status] || b.status,
      "Aantal bijdragen": ant.length, "Voorstel kleur": v ? (KLEUR[v.kleur] || v.kleur) : "", "Voorstel": v ? v.tekst : ""};
  });
  const ws2 = XLSX.utils.json_to_sheet(per);
  ws2["!cols"] = [{wch:22},{wch:5},{wch:34},{wch:14},{wch:16},{wch:14},{wch:60}];
  const ws3 = XLSX.utils.aoa_to_sheet([["Sessie", s.titel], ["Sessiecode", s.code], ["Datum", s.datum || ""],
    ["Cliëntreis", staat.reis?.clientreis || s.reis_id], ["Aantal bijdragen", staat.antwoorden.length],
    ["Geëxporteerd op", new Date().toLocaleString("nl-NL")],
    ["Let op", "De kleurvoorstellen zijn alleen een voorstel uit de antwoorden; de groep beslist."]]);
  ws3["!cols"] = [{wch:18},{wch:80}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws1, "Bijdragen");
  XLSX.utils.book_append_sheet(wb, ws2, "Per bouwsteen");
  XLSX.utils.book_append_sheet(wb, ws3, "Sessie");
  XLSX.writeFile(wb, `werksessie_${s.reis_id}_${s.code}_${stempel}.xlsx`);
}

function exporteer(soort) {
  const s = staat.sessie, stempel = new Date().toISOString().slice(0,16).replace(/[-:T]/g,"");
  if (soort === "xlsx") return exporteerExcel(stempel);
  let inhoud, type, naam;
  if (soort === "json") {
    inhoud = JSON.stringify({sessie:s, reis:staat.reis, bouwstenen:staat.bouwstenen, antwoorden:staat.antwoorden,
      voorstellen:Object.fromEntries(staat.bouwstenen.map(b => [b.bouwsteen_id, voorstel(b, staat.antwoorden.filter(a=>a.bouwsteen_id===b.bouwsteen_id))])),
      geexporteerd_op:new Date().toISOString()}, null, 2);
    type = "application/json"; naam = `werksessie_${s.reis_id}_${s.code}_${stempel}.json`;
  } else {
    const kol = ["ontvangen_op","bouwsteen_id","status_bij_antwoord","vraagset","discipline","antwoord"];
    const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
    inhoud = "﻿" + kol.join(";") + "\n" + staat.antwoorden.map(a =>
      kol.map(k => q(k === "antwoord" ? JSON.stringify(a.antwoord) : a[k])).join(";")).join("\n");
    type = "text/csv"; naam = `werksessie_${s.reis_id}_${s.code}_${stempel}.csv`;
  }
  const url = URL.createObjectURL(new Blob([inhoud], {type}));
  const l = document.createElement("a"); l.href = url; l.download = naam; l.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

start();
</script>
